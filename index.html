
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Expense Tracker</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
.container{
  max-width:500px;
  margin:auto;
}
h1{text-align:center;color:#167c60}
.card{
  background:white;
  padding:18px;
  border-radius:14px;
  margin:15px 0;
  box-shadow:0 2px 10px #0001;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  background:#e8f5ef;
  padding:14px;
  border-radius:10px;
}
input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}
button{
  background:#16835f;
  color:white;
  border:0;
  font-weight:bold;
}
.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.delete{
  width:auto;
  padding:7px 10px;
  background:#dc4444;
}
small{color:#64748b}
</style>
</head>
<body>
<div class="container">
<h1>💰 Smart Expense Tracker</h1>
<p style="text-align:center">Manage your daily money easily</p>

<div class="card stats">
 <div class="stat">
  <small>Total Income</small>
  <h3 id="income">TZS 0</h3>
 </div>
 <div class="stat">
  <small>Total Expense</small>
  <h3 id="expense">TZS 0</h3>
 </div>
</div>

<div class="card">
 <small>Available Balance</small>
 <h2 id="balance">TZS 0</h2>
</div>

<div class="card">
 <h3>Add New Transaction</h3>
 <input id="description" placeholder="Enter description">
 <input id="amount" type="number" min="1" placeholder="Enter amount">
 <select id="type">
  <option value="income">Income</option>
  <option value="expense">Expense</option>
 </select>
 <button onclick="addTransaction()">Add Transaction</button>
</div>

<div class="card">
 <h3>Transaction History</h3>
 <div id="history">No transactions yet.</div>
</div>
</div>

<script>
let transactions = JSON.parse(
 localStorage.getItem("transactions") || "[]"
);

function money(value){
 return "TZS " + value.toLocaleString("en-US");
}

function addTransaction(){
 const description =
 document.getElementById("description").value.trim();
 const amount =
 Number(document.getElementById("amount").value);
 const type =
 document.getElementById("type").value;

 if(!description || !Number.isFinite(amount) || amount<=0){
  alert("Please enter a description and valid amount.");
  return;
 }

 transactions.push({
  id:Date.now(),
  description,
  amount,
  type
 });

 save();
 document.getElementById("description").value="";
 document.getElementById("amount").value="";
}

function removeTransaction(id){
 transactions=transactions.filter(t=>t.id!==id);
 save();
}

function save(){
 localStorage.setItem(
  "transactions",JSON.stringify(transactions)
 );
 render();
}

function render(){
 let income=0,expense=0;
 const history=document.getElementById("history");

 history.innerHTML="";

 transactions.forEach(t=>{
  if(t.type==="income") income+=t.amount;
  else expense+=t.amount;

  const item=document.createElement("div");
  item.className="item";

  const details=document.createElement("span");
  details.textContent=t.description+" — "+
   (t.type==="income"?"+":"-")+money(t.amount);

  const del=document.createElement("button");
  del.className="delete";
  del.textContent="Delete";
  del.onclick=()=>removeTransaction(t.id);

  item.append(details,del);
  history.appendChild(item);
 });

 if(transactions.length===0){
  history.textContent="No transactions yet.";
 }

 document.getElementById("income").textContent=money(income);
 document.getElementById("expense").textContent=money(expense);
 document.getElementById("balance").textContent=
  money(income-expense);
}

render();
</script>
</body>
</html>
